name: Pruebas

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unitarias (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit

  integration:
    name: Integración (Node ${{ matrix.node }})
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Ejecutar pruebas de integración
        run: npm run test:integration

  coverage:
    name: Cobertura
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package.json
            package-lock.json

      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Ejecutar todas las pruebas con cobertura
        run: npm run test:coverage

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k, n) => `| ${n} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("## Cobertura de pruebas\n");
              console.log("| Métrica | % | Cubiertas |\n|---|---|---|");
              console.log([row("statements","Sentencias"), row("branches","Ramas"), row("functions","Funciones"), row("lines","Líneas")].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
